[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-workflows"
# `readme` is dynamic: a custom metadata hook (hatch_build.py) sets the long-description to
# README.md with relative links rewritten to absolute tag-pinned GitHub URLs so they work on
# PyPI (D-PyPI). The source README.md is never modified. `version` is our git-tag resolver.
dynamic = ["version", "readme"]
description = "Reusable, tool-agnostic agent workflows (review, assess, advise, verify, setup) plus a CLI to install them into any repo."
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Gabriele Fariello", email = "gfariello@fariel.com" }]
keywords = ["agent", "workflows", "code-review", "llm", "cli", "developer-tools"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
]
# ONE runtime dependency, declared deliberately. Dependency MINIMIZATION is the operative
# principle here, NOT a prohibition (DECISIONS D138, which clarifies D44/D46): add a runtime
# dep only when it adds real value, weighing the cost to users; prefer the stdlib when it does
# the job easily. Everywhere else the stdlib still suffices, and this is the only exception.
#
# WHY `filelock` EARNS IT. Six modules used to `import fcntl` at TOP LEVEL. `fcntl` is
# POSIX-only, so on Windows the package failed at IMPORT, before any of its own code could run
# - including the code whose job is to report the limitation. Replacing it needs a real
# cross-platform file lock, and hand-rolling one is the trap: the Windows primitive
# `msvcrt.locking` locks a BYTE RANGE from the current file position rather than the whole
# file, so two processes can lock DISJOINT ranges of the same file and BOTH believe they hold
# an exclusive lock. That is a SILENT mutual-exclusion failure, in the code that serializes
# every driver run and every registry write. `filelock` is a single, small, mature, widely
# deployed library that handles it, so this buys correctness we would otherwise have to
# re-derive and re-test ourselves. See `agent_workflows/platform_lock.py` for the contract.
#
# A version FLOOR, not a pin: `>=3` is where the modern `filelock` API (`FileLock`, `Timeout`,
# and the `timeout=` semantics this code relies on) has been stable, and pinning tighter would
# pick fights with the lockfiles of the repos that install this tool.
#
# DECLARED EVEN THOUGH IT ALREADY IMPORTS on a maintainer machine, where `filelock` is present
# only as a TRANSITIVE dependency of something else. Relying on that is exactly the
# reproducibility hole documented in the `pytest-randomly` note below, where a maintainer venv
# and a clean install ran different code. An accidental transitive install is not a dependency.
dependencies = ["filelock>=3"]

# TEST-ONLY dependencies. These are NOT runtime deps (the shipped package needs only the one
# declared above) and are never imported by agent_workflows/*. pytest-xdist is REQUIRED to run the
# suite: `-n auto` is the default (addopts below + `make test`), so the suite ALWAYS runs
# in parallel and never serially. Install the test deps with `make install-dev`,
# `pip install '.[test]'`, or `pip install --group dev` (PEP 735 group below). pytest is
# only the runner; the tests themselves are plain stdlib `unittest.TestCase`.
#
# pytest-randomly is DECLARED because it CHANGES OBSERVED BEHAVIOR: it shuffles test order
# every run, which is how order-dependence bugs get caught. It was previously present in
# maintainer venvs but absent from this file, so a clean `pip install '.[test]'` (and CI)
# ran a DIFFERENT, unshuffled suite than the maintainer did - an undeclared dep that alters
# results is a reproducibility hole, not a convenience. Declaring it makes the shuffle a
# property of the project. Reproduce a failing order with `-p randomly --randomly-seed=<n>`
# (the seed is printed in the run header); never paper over an order failure with
# `-p no:randomly`, which hides the bug instead of fixing it.
#
# PyYAML IS IN THE TEST EXTRA, and the reason is worth stating because it looks like a runtime dep
# and is not. `workflow_source.parse_entry` imports `yaml` INSIDE the function and raises an
# actionable `SourceError` if it is missing, precisely so importing the package never pulls a YAML
# parser onto a runtime path (D139). That design is intact and unchanged here.
#
# But the SUITE exercises that build-time path (the workflow schema compiler, the migration
# inventory, and one CLI preview test all load a workflow package), so without PyYAML installed
# those tests fail on a missing optional dependency rather than on anything they mean to assert.
# Measured in a clean CI-equivalent venv: 28 failures across three modules, every one of them the
# `PyYAML is required at build/authoring time` refusal. That refusal message already tells the
# reader to "install the dev/build extra" - which, until now, DECLARED NO SUCH THING. The message
# was correct about the intent and pointed at an extra that did not exist.
#
# So it belongs in `test` (and `dev`), NOT in `dependencies`: shipping it as a runtime requirement
# would contradict D139 and force a YAML parser on every consumer of the CLI, while leaving it
# undeclared makes a clean checkout unable to run its own suite.
[project.optional-dependencies]
test = ["pytest>=8", "pytest-xdist>=3", "pytest-randomly>=3", "PyYAML>=6"]

# PEP 735 dependency group so `pip install --group dev` (or `pip install -e . --group dev`)
# always pulls the tools needed to work on this repo, guaranteeing pytest-xdist is present
# and the suite runs in parallel. Mirrors the `test` extra; kept in sync with it.
[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3", "pytest-randomly>=3", "PyYAML>=6"]

[project.urls]
Homepage = "https://github.com/fariello/agent-workflows"
Repository = "https://github.com/fariello/agent-workflows"
Issues = "https://github.com/fariello/agent-workflows/issues"
Changelog = "https://github.com/fariello/agent-workflows/releases"

# Three console scripts, all -> the same entry point (spec OQ1; collision research).
# If `aw` is already used by another tool on your system, use `agentwf` or `agent-workflows`.
[project.scripts]
agent-workflows = "agent_workflows.cli:main"
aw = "agent_workflows.cli:main"
agentwf = "agent_workflows.cli:main"

# Version comes from our own git-tag-driven resolver via a custom hatch version source
# (hatch_build.py), NOT hatch-vcs - single source of versioning truth, no extra build dep.
[tool.hatch.version]
source = "code"
path = "hatch_build.py"
expression = "VERSION"
search-paths = ["."]

# Custom metadata hook (same hatch_build.py) computes the dynamic `readme` long-description:
# README.md with relative links absolutized to the release tag. Stdlib only (no
# hatch-fancy-pypi-readme build dep, per D46).
[tool.hatch.metadata.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
# The importable package.
packages = ["agent_workflows"]

# Ship the workflow tree as package data WITHOUT moving it in the repo: map the repo-root
# .aw/system/ into the wheel under agent_workflows/_data/.aw/system/ so the 3.8-safe
# __file__/_data lookup in _compat.packaged_source_root() finds it (OQ5, R-1). Canonical
# layout is NESTED (spec S4.1): the invokable bundle nests under .aw/system/workflows/ with
# VERSION/manifest as system-root siblings; resolve_source_root descends into workflows/.
# The bundle ships ONCE, at .aw/system (the Order-11 self-migration moved it there).
[tool.hatch.build.targets.wheel.force-include]
".aw/system" = "agent_workflows/_data/.aw/system"

[tool.hatch.build.targets.sdist]
# The sdist carries what a build needs: the package, the data tree, the version hook, and
# the standard metadata files. It deliberately excludes dev/meta content.
include = [
    "/agent_workflows",
    "/.aw/system",
    "/hatch_build.py",
    "/pyproject.toml",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
]
# NOTE (Order 05, S6-C01): hatchling injects the VCS `.gitignore` into the sdist by default and a
# sdist-target `exclude` does not override that injection (verified). The include-list above is the
# intended contract; the extra `.gitignore` is harmless dev-meta (the WHEEL never carries it). Left
# as-is rather than adding non-functional config; a future hatchling `ignore-vcs`-style knob can drop
# it if desired. This was the only optional C01 nit not applied.

# Pytest is used ONLY as a parallel test runner (see the `test` extra). The tests are
# stdlib unittest.TestCase and also run under `python -m unittest discover -s tests -t .`.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: heavy subprocess/integration tests (spawn the CLI, install into temp repos). Deselected by default for a fast per-run suite; run them with `make test-all` / `-m ''`.",
]
# Two dials, both always on in the default invocation:
#  1) `-n auto` (pytest-xdist, one worker per CPU) so the suite NEVER runs serially.
#     pytest-xdist is a required test dep (the `test` extra + the `dev` group), and the
#     root conftest.py auto-installs it as a last resort if it is somehow missing.
#     `--dist=worksteal` lets idle workers steal queued tests so one straggler cannot
#     stall the whole run.
#  2) `-m "not slow"` so the DEFAULT run is the FAST subset (pure-logic unit tests, ~24s).
#     The ~9 subprocess-heavy files are marked `slow` and excluded here; run the FULL
#     suite for release-review / CI with `make test-all` (which passes `-m ""`).
# To force serial when debugging a test-isolation issue: `make test-serial`
# (`python -m unittest discover -s tests -t .`).
addopts = "-q -n auto --dist=worksteal -m 'not slow'"
