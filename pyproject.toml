[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-workflows"
# `readme` is dynamic: a custom metadata hook (hatch_build.py) sets the long-description to
# README.md with relative links rewritten to absolute tag-pinned GitHub URLs so they work on
# PyPI (D-PyPI). The source README.md is never modified. `version` is our git-tag resolver.
dynamic = ["version", "readme"]
description = "Reusable, tool-agnostic agent workflows (review, assess, advise, verify, setup) plus a CLI to install them into any repo."
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Gabriele Fariello", email = "gfariello@fariel.com" }]
keywords = ["agent", "workflows", "code-review", "llm", "cli", "developer-tools"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
]
# No runtime dependencies today (DECISIONS D44/D46). This is dependency MINIMIZATION,
# not a prohibition (D138): add a runtime dep when it adds real value, weighing the cost
# to users; prefer the stdlib when it does the job easily. Currently the stdlib suffices.
dependencies = []

# TEST-ONLY dependencies. These are NOT runtime deps (the shipped package currently needs
# none; D138) and are never imported by agent_workflows/*. Install with
# `pip install '.[test]'` to run the suite in parallel via `make test` / `pytest -n auto`.
# The tests themselves are plain stdlib `unittest.TestCase`; pytest is only the runner,
# and `make test-serial` (python -m unittest) always works without these.
[project.optional-dependencies]
test = ["pytest>=8", "pytest-xdist>=3"]

[project.urls]
Homepage = "https://github.com/fariello/agent-workflows"
Repository = "https://github.com/fariello/agent-workflows"
Issues = "https://github.com/fariello/agent-workflows/issues"
Changelog = "https://github.com/fariello/agent-workflows/releases"

# Three console scripts, all -> the same entry point (spec OQ1; collision research).
# If `aw` is already used by another tool on your system, use `agentwf` or `agent-workflows`.
[project.scripts]
agent-workflows = "agent_workflows.cli:main"
aw = "agent_workflows.cli:main"
agentwf = "agent_workflows.cli:main"

# Version comes from our own git-tag-driven resolver via a custom hatch version source
# (hatch_build.py), NOT hatch-vcs - single source of versioning truth, no extra build dep.
[tool.hatch.version]
source = "code"
path = "hatch_build.py"
expression = "VERSION"
search-paths = ["."]

# Custom metadata hook (same hatch_build.py) computes the dynamic `readme` long-description:
# README.md with relative links absolutized to the release tag. Stdlib only (no
# hatch-fancy-pypi-readme build dep, per D46).
[tool.hatch.metadata.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
# The importable package.
packages = ["agent_workflows"]

# Ship the workflow tree as package data WITHOUT moving it in the repo: map the repo-root
# .aw/system/ into the wheel under agent_workflows/_data/.aw/system/ so the 3.8-safe
# __file__/_data lookup in _compat.packaged_source_root() finds it (OQ5, R-1). Canonical
# layout is NESTED (spec S4.1): the invokable bundle nests under .aw/system/workflows/ with
# VERSION/manifest as system-root siblings; resolve_source_root descends into workflows/.
# The bundle ships ONCE, at .aw/system (the Order-11 self-migration moved it there).
[tool.hatch.build.targets.wheel.force-include]
".aw/system" = "agent_workflows/_data/.aw/system"

[tool.hatch.build.targets.sdist]
# The sdist carries what a build needs: the package, the data tree, the version hook, and
# the standard metadata files. It deliberately excludes dev/meta content.
include = [
    "/agent_workflows",
    "/.aw/system",
    "/hatch_build.py",
    "/pyproject.toml",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
]
# NOTE (Order 05, S6-C01): hatchling injects the VCS `.gitignore` into the sdist by default and a
# sdist-target `exclude` does not override that injection (verified). The include-list above is the
# intended contract; the extra `.gitignore` is harmless dev-meta (the WHEEL never carries it). Left
# as-is rather than adding non-functional config; a future hatchling `ignore-vcs`-style knob can drop
# it if desired. This was the only optional C01 nit not applied.

# Pytest is used ONLY as a parallel test runner (see the `test` extra). The tests are
# stdlib unittest.TestCase and also run under `python -m unittest discover -s tests -t .`.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
