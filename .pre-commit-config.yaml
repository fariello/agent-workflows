# Verbatim-preserved paths. Content-MUTATING hooks (whitespace/eof fixers, ruff lint+format)
# are excluded for these so they never rewrite as-delivered artifacts:
#   - .aw/records/research/: the current flat tree of cited external research artifacts
#     (their own formatting/punctuation is intentional). The legacy .agents/docs/research/
#     path is retained for a target repo still on that layout.
#   - .aw/system/: the migrated workflow bundle (a relocated copy of the delivered .agents/
#     workflows/ tree; the legacy source copies are still linted/formatted, so the bundle stays
#     clean without re-mutating the migrated tree).
# Writer-side twin: artifact_core._VERBATIM_PRESERVED_SEGMENTS carries the same policy for the
# toolkit's own writer, and tests/test_precommit_verbatim_exclusions.py pins the two together.
# SAFETY hooks (gitleaks, large-file check, local-leaks) still apply everywhere, including these
# paths, so secrets or oversized blobs cannot slip in.
# Hook TYPES installed by `pre-commit install` (integpath 29wvmj, testtier hguae9). `pre-commit` alone
# is not enough: git runs `pre-merge-commit` for an automated merge and `pre-push` before push.
# NOTE this changes what a FRESH install does and cannot retrofit an EXISTING clone: one hook
# script is written per installed type, so a clone set up before this change has only the previously
# installed hooks and must re-run `pre-commit install` to gain the new stage (see CONTRIBUTING).
default_install_hook_types: [pre-commit, pre-merge-commit, pre-push]


# `default_stages` is PINNED to pre-commit deliberately. It otherwise defaults to ALL stages, so merely
# installing the second hook type above would ALSO run every content-MUTATING hook (ruff --fix,
# whitespace/eof fixers) during an automated merge, rewriting a merge result mid-merge. Only the
# executed-transition gate opts into `pre-merge-commit`, via its own explicit `stages:` below.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: '^(\.agents/docs/research/|\.aw/records/research/|\.aw/system/)'
      - id: end-of-file-fixer
        exclude: '^(\.agents/docs/research/|\.aw/records/research/|\.aw/system/)'
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix]
        exclude: '^(\.agents/docs/research/|\.aw/records/research/|\.aw/system/)'
      - id: ruff-format
        exclude: '^(\.agents/docs/research/|\.aw/records/research/|\.aw/system/)'

  # Local guard (D92/D93): no local leaks (identifying info) in TRACKED files. Scans the whole
  # tracked tree (not just staged files) via the packaged agent_workflows.local_leaks engine,
  # so it cannot be bypassed by staging a subset; runs once per commit.
  - repo: local
    hooks:
      - id: local-leaks
        name: no local leaks in tracked files
        entry: python3 -m agent_workflows check-local-leaks
        language: system
        pass_filenames: false
        always_run: true

      # ipdgates Order dulzpy: LOCAL prevention of a raw (non-finalize) plan->executed commit
      # (hand-edited `- Status: executed` or `git mv` into executed/ then a raw `git commit`, which
      # bypasses `aw ipd finalize`'s receipt/scope/attribution gates). Inspects the staged diff and,
      # for each plan gaining executed status / moved into executed/, requires matching finalize
      # evidence in .aw/state/ OR, during a MERGE, an incoming-side `lifecycle(<id6>): finalize` commit
      # (integpath 29wvmj: the journal lives under gitignored .aw/state/, so it cannot travel with a
      # lane branch and every integration of a genuinely finalized lane used to be refused).
      # Best-effort/local only (skippable with --no-verify); the deterministic backstop is the local
      # proclint detector via `aw check`/`aw doctor`. No CI enforcement.
      #
      # THE ONLY hook registered for `pre-merge-commit` as well as `pre-commit`, because that is the
      # stage git runs for an AUTOMATED merge; without it an automated merge carrying a plan into
      # executed/ is not gated at all. Honest limit: `pre-merge-commit` does NOT run for a
      # fast-forward merge (no commit is created) or on the conflicted-then-resolved path (git runs
      # prepare-commit-msg/commit-msg, and the final `git commit` there is covered by `pre-commit`).
      - id: ipd-executed-transition-gate
        name: no raw plan->executed commit (use aw ipd finalize)
        entry: python3 -m agent_workflows ipd-executed-gate
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-merge-commit]

      # proclint 79li67: LOCAL prevention of a raw (untooled) INTERMEDIATE plan status change - the
      # sibling of the dulzpy terminal gate above. Inspects the staged diff and, for each plan whose
      # `- Status:` changed in this commit with NO matching tool-authored `## Workflow history` line
      # (the fingerprint of a hand-edit), refuses naming `aw set <status> <id6>`. Commit-scoped (only
      # changed plan files; executed/ and history-less types excluded). Best-effort/local only
      # (skippable with --no-verify; a hand-edit that also adds a plausible line evades it); the
      # deterministic backstop is `aw check`/`aw doctor`. No CI enforcement.
      - id: ipd-status-untooled-gate
        name: no untooled plan status change (use aw set)
        entry: python3 -m agent_workflows ipd-status-untooled-gate
        language: system
        pass_filenames: false
        always_run: true

      # Fast-first pre-push ordering: check remote fast-forward (~0.5s), attention (~8s), and mypy
      # (~18s) BEFORE spending ~15 minutes on the thorough test suite. Each fast gate sets
      # fail_fast: true so pre-commit aborts immediately instead of falling through to thorough-suite.
      - id: prepush-fast-forward-gate
        name: verify remote fast-forward before slow push gates
        entry: python3 -m agent_workflows.hooks.prepush_fast_forward_gate
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
        fail_fast: true
        verbose: true

      # basegate (run-20261107T023507Z-1895321): COMMIT-TIME type gate. A hand commit put a mypy
      # error on main that only the pre-push hook would have caught, and the next unattended run
      # inherited it. This checks the STAGED tree (git write-tree), never the working tree, and
      # refuses only errors the commit ADDS relative to HEAD, so a co-worker's unstaged edit or an
      # error already on HEAD cannot block an unrelated commit. Skipped when no agent_workflows/*.py
      # or mypy config file is staged. Warm cost is well under a second via the shared
      # <git-common-dir>/aw-mypy-cache; the first run in a clone is a cold mypy run (~20s here).
      - id: static-type-gate-commit
        name: static type gate on staged changes (new mypy errors vs HEAD)
        entry: python3 -m agent_workflows.typecheck_gate staged
        language: system
        pass_filenames: false
        always_run: true

      # cihealth: cross-tree attention and artifact contract check before push.
      - id: attention-gate
        name: attention and artifact check before push
        entry: python3 -m agent_workflows attention --check --agent
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
        fail_fast: true
        verbose: true

      # cihealth: static type gate before push (uses shared <git-common-dir>/aw-mypy-cache).
      - id: static-type-gate
        name: static type gate before push (mypy agent_workflows)
        entry: python3 -m agent_workflows.typecheck_gate tree HEAD
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
        fail_fast: true
        verbose: true

      # testtier hguae9: Run the thorough test suite before git push.
      # Local feedback only (skippable with --no-verify); not an authority boundary.
      # Omit --slots 1 so resolve_suite_slots defaults to max(1, cpus // 6) (2 slots / 6 workers
      # on a 12-thread host, staying at <= half the threads and avoiding slot-wait stalls).
      - id: thorough-suite
        name: thorough test suite before push
        entry: python3 -m agent_workflows suite --thorough
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
        verbose: true
