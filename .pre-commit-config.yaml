# Verbatim-preserved paths. Content-MUTATING hooks (whitespace/eof fixers, ruff lint+format)
# are excluded for these so they never rewrite as-delivered artifacts:
#   - .agents/docs/research/ and .aw/records/docs/research/: cited external research artifacts
#     (their own formatting/punctuation is intentional; the .aw/ path mirrors the legacy one
#     after the physical-layout migration).
#   - .aw/system/: the migrated workflow bundle (a relocated copy of the delivered .agents/
#     workflows/ tree; the legacy source copies are still linted/formatted, so the bundle stays
#     clean without re-mutating the migrated tree).
# SAFETY hooks (gitleaks, large-file check, local-leaks) still apply everywhere, including these
# paths, so secrets or oversized blobs cannot slip in.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: '^(\.agents/docs/research/|\.aw/records/docs/research/|\.aw/system/)'
      - id: end-of-file-fixer
        exclude: '^(\.agents/docs/research/|\.aw/records/docs/research/|\.aw/system/)'
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix]
        exclude: '^(\.agents/docs/research/|\.aw/records/docs/research/|\.aw/system/)'
      - id: ruff-format
        exclude: '^(\.agents/docs/research/|\.aw/records/docs/research/|\.aw/system/)'

  # Local guard (D92/D93): no local leaks (identifying info) in TRACKED files. Scans the whole
  # tracked tree (not just staged files) via the packaged agent_workflows.local_leaks engine,
  # so it cannot be bypassed by staging a subset; runs once per commit.
  - repo: local
    hooks:
      - id: local-leaks
        name: no local leaks in tracked files
        entry: python3 -m agent_workflows check-local-leaks
        language: system
        pass_filenames: false
        always_run: true

      # ipdgates Order dulzpy: LOCAL prevention of a raw (non-finalize) plan->executed commit
      # (hand-edited `- Status: executed` or `git mv` into executed/ then a raw `git commit`, which
      # bypasses `aw ipd finalize`'s receipt/scope/attribution gates). Inspects the staged diff and,
      # for each plan gaining executed status / moved into executed/, requires matching finalize
      # evidence in .aw/state/. Best-effort/local only (skippable with --no-verify); the deterministic
      # backstop is the local proclint detector via `aw check`/`aw doctor`. No CI enforcement.
      - id: ipd-executed-transition-gate
        name: no raw plan->executed commit (use aw ipd finalize)
        entry: python3 -m agent_workflows ipd-executed-gate
        language: system
        pass_filenames: false
        always_run: true

      # proclint 79li67: LOCAL prevention of a raw (untooled) INTERMEDIATE plan status change - the
      # sibling of the dulzpy terminal gate above. Inspects the staged diff and, for each plan whose
      # `- Status:` changed in this commit with NO matching tool-authored `## Workflow history` line
      # (the fingerprint of a hand-edit), refuses naming `aw set <status> <id6>`. Commit-scoped (only
      # changed plan files; executed/ and history-less types excluded). Best-effort/local only
      # (skippable with --no-verify; a hand-edit that also adds a plausible line evades it); the
      # deterministic backstop is `aw check`/`aw doctor`. No CI enforcement.
      - id: ipd-status-untooled-gate
        name: no untooled plan status change (use aw set)
        entry: python3 -m agent_workflows ipd-status-untooled-gate
        language: system
        pass_filenames: false
        always_run: true
