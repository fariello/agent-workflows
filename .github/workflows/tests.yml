name: tests

# Run the framework's stdlib-unittest self-tests and verify the wheel builds and imports,
# across Linux, macOS, and Windows (IPD-2). The suite has zero runtime dependencies, so no
# install step is needed for it; the wheel job installs the dev build backend only. This
# workflow only tests/builds: it never publishes, deploys, uploads, or touches remote
# state, and needs no secrets.

on:
  push:
    branches: [main, master, "fix/win-gaps"]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    name: unittest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Every supported Python minor (3.9 the declared floor through 3.14 the current
        # release) on every OS. The suite has zero runtime deps and is fast, so the full
        # cross-product is affordable and catches per-version regressions (e.g. PEP 649
        # annotation evaluation on 3.14 vs eager on <=3.13). 3.8 is end-of-life and not
        # provisioned; the code uses `from __future__ import annotations` and no runtime
        # 3.9+-only feature, so 3.8 is expected to work but is not CI-verified.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the git-tag-driven version resolver and the scanner's
          # history scan behave as in a real clone.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Configure git identity (some tests init throwaway repos)
        shell: bash
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main

      - name: Install the project + its test extra
        shell: bash
        # INSTALL THE PROJECT, do not hand-list the runner. This step used to be
        # `pip install pip build pytest pytest-xdist`, on the premise (in its own comment) that
        # "the shipped package stays stdlib-only". That premise stopped being true when
        # `filelock` became a real runtime dependency, and this step was never updated: CI then
        # ran the suite with a DECLARED dependency missing. Measured in a clean venv built from
        # the old step, `filelock` and `pytest-randomly` were both absent and the suite reported
        # 155 failed / 62 errors, nearly all of them `ModuleNotFoundError` cascades rather than
        # real defects.
        #
        # `-e .[test]` resolves `dependencies` and `optional-dependencies.test` from
        # pyproject.toml, so the environment follows the project instead of drifting from it, and
        # a future dependency needs no edit here. It also restores `pytest-randomly`, which is
        # declared precisely because it shuffles test order; without it CI was running a
        # different, unshuffled suite than the maintainer.
        #
        # `build` stays explicit: it belongs to the packaging gate, not to the test environment.
        run: python -m pip install --upgrade pip build && python -m pip install -e ".[test]"

      - name: Run self-tests (parallel)
        shell: bash
        # Process-based parallelism; the suite is xdist-safe (per-process AW_HOME sandbox,
        # per-test tempdirs). `python -m unittest discover -s tests -t .` remains an
        # equivalent serial fallback (see `make test-serial`).
        run: python -m pytest tests/ -n auto -rfEs

  wheel:
    name: build + import wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install the build frontend (dev-only; no runtime deps)
        shell: bash
        run: python -m pip install --upgrade build

      - name: Build the wheel
        shell: bash
        run: python -m build --wheel

      - name: Install the built wheel into a clean venv and smoke-test the CLI
        shell: bash
        run: |
          python -m venv .wheeltest
          if [ -f .wheeltest/bin/python ]; then
            PY=.wheeltest/bin/python
          else
            PY=.wheeltest/Scripts/python
          fi
          "$PY" -m pip install --upgrade pip
          # Install the single built wheel (glob differs per OS shell; bash is available).
          "$PY" -m pip install dist/*.whl
          # The console script and the packaged data lookup must both work from
          # site-packages (run from a scratch dir so the source tree does not shadow it).
          "$PY" -c "import agent_workflows, agent_workflows.cli; print('import ok', agent_workflows.__version__)"
          "$PY" -m agent_workflows --version

  attention-check:
    name: attention + specs contract check (fail-closed)
    runs-on: ubuntu-latest
    # The cross-tree attention view and the specs contract are validated here as a fail-closed gate,
    # matching the secret-scan / local-leaks single-job precedent. Read-only; writes nothing; no
    # secrets; needs the full .aw/records/ tree once (not per Python matrix). Zero runtime deps.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install the project (runtime deps, e.g. filelock)
        shell: bash
        # The CLI imports `filelock` at parser build, so running `python -m agent_workflows`
        # from a bare checkout fails with ModuleNotFoundError. Install the project itself so
        # its declared runtime dependencies are present.
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: aw specs check (spec status/gate/history contract)
        shell: bash
        run: python -m agent_workflows specs check

      - name: aw attention --check (cross-tree attention view; fail closed)
        shell: bash
        run: python -m agent_workflows attention --check --agent

      # agentadhere Phase 5 (r2ks4k E-01): run the SAME shipped phase-1 policy engine
      # (python -m agent_workflows check ...) over the committed artifact types in a clean, remote
      # environment and FAIL the job on any finding. This is the authoritative repository boundary
      # the local phase-4 hooks defer to; CI and local `aw check` come from the SAME check_engine
      # (no forked/inlined policy). NOTE: no second test-run step is added - the `unittest` job
      # already runs the full suite; this gate only runs the artifact-conformance engine.
      - name: aw check plans (plan conformance; fail closed)
        shell: bash
        run: python -m agent_workflows check plans --agent

      - name: aw check releases (release-record conformance; fail closed)
        shell: bash
        run: python -m agent_workflows check releases --agent

      # smallfix-01 (`0i4fkt`), backlog `e85snf`: backlog conformance is now fail-closed.
      # The backlog name/summary debt that previously kept this advisory (DECISION 18-r2ks4k-D1)
      # is cleared; the baseline measures clean (exit 0) with info-level findings only.
      - name: aw check backlog (backlog conformance; fail closed)
        shell: bash
        run: python -m agent_workflows check backlog --agent

      # release-gates is currently ADVISORY (report-only), NOT fail-closed: the tree carries two
      # pre-existing findings (check.live-bug-ungated on 7l1ggb and check.from-backlog-dangling on
      # executed plan mjx7ne with From-Backlog: none) that a fail-closed gate would red `main` on.
      # It joins the fail-closed set above once those baseline findings are cleaned or resolved
      # (see backlog 7dcw6z and IPD 2vw35i). It runs the SAME shipped engine (aw check release-gates)
      # so the release-gate family is visible in CI; `|| true` keeps it non-blocking for now.
      - name: aw check release-gates (release-gate family; ADVISORY until baseline findings cleared)
        shell: bash
        run: |
          python -m agent_workflows check release-gates --agent || \
            echo "::warning::aw check release-gates reported findings (advisory; see IPD 2vw35i - flip to fail-closed after 7l1ggb and From-Backlog none baseline findings are resolved)"

  output-conformance:
    name: CLI output-conformance harness (fail-closed)
    runs-on: ${{ matrix.os }}
    # awcliux Order 05 (e8hu4s) / cmdsurf (0yrtne): the whole-CLI declaration test runs as a
    # NAMED fail-closed gate so an undeclared parser leaf blocks the merge visibly. Runs across
    # every supported Python minor so the parser leaves are proven declared across versions.
    # Read-only; writes nothing; no secrets; zero runtime deps.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Configure git identity (some tests init throwaway repos)
        shell: bash
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main

      - name: Install the project + its test extra
        shell: bash
        # Same fix as the `unittest` job above: install the PROJECT so its declared runtime
        # dependencies (currently `filelock`) are present, rather than hand-listing the runner and
        # asserting the package is stdlib-only. The old step's claim was stale.
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Run the output-conformance harness (E-01 matrix + E-02 gates + E-03 docs)
        shell: bash
        run: |
          python -m pytest \
            tests/test_command_surface_declarations.py
